<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Employee XML Reader</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        table {
            border-collapse: collapse;
            width: 90%;
            margin: auto;
        }

        th,
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: purple;
            color: white;
        }

        tr:nth-child(even) {
            background-color: lightgreen;
        }

        button {
            padding: 15px;
            font-size: 20px;
            margin-top: 20px;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>

    <script>
        function loadXMLDoc() {

            let xhttp = new XMLHttpRequest();

            xhttp.onreadystatechange = function () {

                if (this.readyState == 4 && this.status == 200) {

                    let xmlDoc = this.responseXML;

                    let employees = xmlDoc.getElementsByTagName("employee");

                    let table =
                        "<tr><th>Firstname</th><th>Lastname</th><th>Title</th><th>Division</th><th>Building</th><th>Room</th></tr>";

                    for (let i = 0; i < employees.length; i++) {

                        table += "<tr>";

                        table += "<td>" +
                            employees[i].getElementsByTagName("firstname")[0].childNodes[0].nodeValue +
                            "</td>";

                        table += "<td>" +
                            employees[i].getElementsByTagName("lastname")[0].childNodes[0].nodeValue +
                            "</td>";

                        table += "<td>" +
                            employees[i].getElementsByTagName("title")[0].childNodes[0].nodeValue +
                            "</td>";

                        table += "<td>" +
                            employees[i].getElementsByTagName("division")[0].childNodes[0].nodeValue +
                            "</td>";

                        table += "<td>" +
                            employees[i].getElementsByTagName("building")[0].childNodes[0].nodeValue +
                            "</td>";

                        table += "<td>" +
                            employees[i].getElementsByTagName("room")[0].childNodes[0].nodeValue +
                            "</td>";

                        table += "</tr>";
                    }

                    document.getElementById("employeeTable").innerHTML = table;
                }
            };

            xhttp.open("GET", "employee.xml", true);

            xhttp.send();
        }
    </script>
</head>

<body>

    <h1>Employee Information</h1>

    <button onclick="loadXMLDoc()">
        Get Employee Details
    </button>

    <br><br>

    <table id="employeeTable"></table>

</body>

</html>
