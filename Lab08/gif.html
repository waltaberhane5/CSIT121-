<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GIF Page</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            color: #222;
        }

        .topnav {
            background-color: #333;
            overflow: hidden;
        }

        .topnav a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        .topnav a:hover {
            background-color: #555;
        }

        .topnav a.active {
            background-color: #777;
        }

        .topnav .icon {
            display: none;
        }

        main {
            width: 80%;
            margin: 30px auto;
            background-color: white;
            padding: 20px;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }

        img {
            max-width: 100%;
        }

        @media screen and (max-width: 600px) {

            .topnav a:not(:first-child) {
                display: none;
            }

            .topnav a.icon {
                float: right;
                display: block;
            }

            .topnav.responsive {
                position: relative;
            }

            .topnav.responsive a {
                float: none;
                display: block;
                text-align: left;
            }
        }

    </style>
</head>

<body>

    <div class="topnav" id="myTopnav">

        <a href="index.html">Home</a>
        <a href="gif.html" class="active">GIF</a>
        <a href="jpg.html">JPG</a>
        <a href="png.html">PNG</a>

        <a href="javascript:void(0);" class="icon"
        onclick="myFunction()">

        <i class="fa fa-bars"></i>

        </a>

    </div>

    <main>

        <h2>GIF Example</h2>

        <img src="images/Lebron.gif"
        alt="Lebron GIF"
        width="300">

        <p>
            This is my Lebron GIF image example.
        </p>

        <p>
            I chose this image because Lebron is one of my favorite players,
            and this is a cool clip of him dunking the ball.
        </p>

        <p>
            Source:
            <a href="https://media.giphy.com/media/Sj5IXn2zYNmQU/giphy.gif"
            target="_blank">

            View GIF Source

            </a>
        </p>

    </main>

    <footer>
        <p>Created by Walta Berhane</p>
    </footer>

    <script>

        function myFunction() {

            var nav = document.getElementById("myTopnav");

            if (nav.className === "topnav") {

                nav.className += " responsive";

            } else {

                nav.className = "topnav";
            }
        }

    </script>

</body>
</html>
